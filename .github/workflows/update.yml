name: 每日学术采集与校验
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 11,23 * * *'
permissions:
  contents: write
concurrency:
  group: academic-daily-update
  cancel-in-progress: false
jobs:
  collect:
    # Zero-cost guard: only standard runners on a public repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 安装唯一采集依赖
        run: python -m pip install -r requirements.txt
      - name: 数据质量回归测试
        run: python -m unittest discover -s tests -v
      - name: 低频采集真实来源
        run: python -u scripts/collect.py
      - name: 生成关注榜、日报、公开数据和RSS
        run: python scripts/build.py
      - name: 校验正式数据
        run: python scripts/validate.py
      - name: 保存真实数据与运行日志
        run: |
          git config user.name 'malilun-hot updater'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data public/feeds evidence/run-*.json
          if git diff --cached --quiet; then
            echo '没有可保存的数据变动'
          else
            git commit -m 'data: update verified academic metadata and run log'
            git push
          fi
